[project]
name = "qsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TomTseng", email = "sshaaangg.tw@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "qiskit>=2.6.0",
    "ruff>=0.17.1",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F401"]  # notebooks import things ahead of the exercises that use them
